<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <title>무적의 틱택토 🤖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>틱택토 vs 🤖</h1>
        
        <div class="settings">
            <label for="difficulty">난이도 설정: </label>
            <select id="difficulty">
                <option value="0.1">쉬움 (바보)</option>
                <option value="0.5">보통 (실수함)</option>
                <option value="0.8">어려움 (똑똑함)</option>
                <option value="1.0" selected>매우 어려움 (무적)</option>
            </select>
        </div>

        <div id="status">게임을 시작하세요!</div>
        <div class="board" id="board"></div>
        <button id="resetBtn">게임 재시작</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
